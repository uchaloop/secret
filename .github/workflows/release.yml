name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pkg-go-dev:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pkg.go.dev to index the release
        env:
          MODULE: github.com/uchaloop/secret/v2
        run: |
          version="${GITHUB_REF_NAME}"
          curl --fail --show-error --silent --retry 4 --retry-all-errors --retry-delay 5 --retry-max-time 180 --connect-timeout 10 --max-time 30 "https://proxy.golang.org/${MODULE}/@v/${version}.info"
